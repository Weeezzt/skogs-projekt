name: Deploy to VAIA (mirror main)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VAIA_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 git.se.vkube.cloud >> ~/.ssh/known_hosts

      - name: Test Git access
        run: |
          GIT_SSH_COMMAND="ssh -v -p 22" git ls-remote "teta@git.se.vkube.cloud:teta.git"

      - name: Push to VAIA
        run: |
          git remote remove vaia 2>/dev/null || true
          git remote add vaia "teta@git.se.vkube.cloud:teta.git"
          git push --force vaia HEAD:refs/heads/main
