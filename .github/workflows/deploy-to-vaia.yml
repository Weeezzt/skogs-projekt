name: Deploy to VAIA (mirror main)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VAIA_HOST: ${{ secrets.VAIA_SSH_HOST }}
      VAIA_USER: ${{ secrets.VAIA_SSH_USER }}
      VAIA_PORT: ${{ secrets.VAIA_GIT_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VAIA_SSH_KEY }}

      - name: Push current commit to VAIA repo
        run: |
          : "${VAIA_PORT:=22}"
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${VAIA_PORT}"
          git remote remove vaia 2>/dev/null || true
          git remote add vaia "ssh://${VAIA_USER}@${VAIA_HOST}:${VAIA_PORT}/teta.git"
          git push --force vaia HEAD:refs/heads/main
